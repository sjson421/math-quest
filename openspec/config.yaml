schema: spec-driven

context: |
  Math Quest is an offline-first React math PWA for GED math practice and foundational skills.

  Read repository authorities instead of repeating them here:
  - AGENTS.md: architecture, invariants, commands, and task-document routing
  - docs/curriculum.md: curriculum, exact skill ids, tone, and content contract
  - docs/roadmap.md: order, dependencies, and selected scope
  - docs/workflow.md: baseline inventory, lifecycle, and sizing

  OpenSpec-specific constraints:
  - No runtime LLM calls. Generators compute answers from their chosen operands.
  - Separate capability infrastructure from content-generator changes.
  - Use the manifest and curriculum authorities together; never duplicate their graph.
  - A data-model change must preserve the progress reconcile and opaque-sync contract.

rules:
  proposal:
    - State which curriculum stage/unit and exact skill ids are in scope, or state that the change is tooling-only.
    - Include a Non-goals section naming deliberately deferred work.
    - Flag every new capability required, such as rendering or input infrastructure.
  design:
    - Separate capability work from content work.
    - For content, name the predicted misconceptions, especially for curriculum walls.
  tasks:
    - A content change may add at most six generators; split larger units into ordered increments and leave the roadmap item unchecked until every increment lands.
    - Give each generator and its independent tests explicit tasks, each under two hours.
    - End with real-app browser validation; use docs/environment.md.
